# La pagina è un file unico (stile, script e foto dentro): qualunque percorso
# risponde con quella. Così funziona sia su /auguri/ sia su /auguri, e sia che
# l'ingresso HTTPS tolga il prefisso /auguri sia che lo lasci.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/html;

    location / {
        try_files /index.html =404;
    }
}

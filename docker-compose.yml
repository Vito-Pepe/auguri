services:
  auguri:
    build: .
    ports:
      # Solo per l'ingresso HTTPS di minigiochi (https://minigiochi.<tailnet>.ts.net/auguri/,
      # repo ingressi-https): niente LAN, niente Internet
      - "127.0.0.1:8095:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
